name: Uptime check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site availability
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://gromche-choir.ru/ || echo "000")
          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="🔴 gromche-choir.ru недоступен (HTTP $STATUS)%0Ahttps://gromche-choir.ru/"
            exit 1
          fi
