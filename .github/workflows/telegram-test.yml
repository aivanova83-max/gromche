name: Telegram bot test

on:
  workflow_dispatch:
  push:
    branches:
      - feat/telegram-fail-notify

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Find chat_id and send test message
        run: |
          UPDATES=$(curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getUpdates")
          CHAT_ID=$(echo "$UPDATES" | jq -r '.result[-1].message.chat.id // empty')

          if [ -z "$CHAT_ID" ]; then
            echo "Не удалось найти chat_id. Ответ Telegram (без токена в тексте):"
            echo "$UPDATES" | jq '.result'
            exit 1
          fi

          echo "Найден chat_id: $CHAT_ID"

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="✅ Бот gromche-choir на связи! Уведомления о сбоях деплоя настроены.")

          echo "$RESPONSE" | jq '.ok, .description'
